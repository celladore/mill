name: deploy

# Manual one-time setup this workflow assumes and cannot itself provision:
#   - An Azure AD app registration federated for GitHub OIDC (azure/login),
#     scoped to celladore-sub (614e6f86-e401-4bdf-8479-a59986e18815) only.
#     Store its ids as repo/environment secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID.
#   - A pre-existing storage account for Terraform remote state in
#     celladore-sub. This workflow does not create one — state storage can't
#     bootstrap itself from the state it would hold. Store the account name
#     as vars.TF_STATE_STORAGE_ACCOUNT, its resource group as
#     vars.TF_STATE_RESOURCE_GROUP, and the blob container as
#     vars.TF_STATE_CONTAINER (falls back to "tfstate" — see the init step).
#   - secrets.TF_VAR_SLUICE_API_KEY — sluice virtual key for the
#     transcription passthrough (backend/config.py SLUICE_API_KEY).
#   - secrets.AZURE_STATIC_WEB_APPS_API_TOKEN — the SWA deployment token.
#     Circular on the very first run: it only exists after `terraform apply`
#     has created the Static Web App (see the swa_api_key output in
#     infra/env/prod/main.tf). Until it's set, skip/ignore the
#     deploy-frontend job rather than inventing a placeholder value.
#   - A GitHub Environment named "production" with required reviewers
#     configured (Settings > Environments). That protection rule is the
#     actual human gate on terraform-apply — this file only declares the
#     environment; it does not (and cannot) enforce approval by itself.

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.14.7"
  IMAGE_NAME: ghcr.io/celladore/xtox-api

jobs:
  # ── Build & push the API image ──────────────────────────────────────────
  # Runs ahead of terraform-apply on every main push that touches backend/**
  # so a fresh digest is available before apply needs var.container_image.
  # Terraform itself never builds or pushes images.
  build-push-api:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Plan on PRs that touch infra/ ───────────────────────────────────────
  # Read-only. Never applies. Failing plan/validate is the check that blocks
  # merge — no apply happens from this job under any circumstance.
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/env/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive ../..

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 614e6f86-e401-4bdf-8479-a59986e18815 # celladore-sub — pinned, not inherited from CLI/runner context

      - run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=xtox-prod.tfstate"

      - run: terraform validate

      # No container_image is passed here on purpose: a PR that only touches
      # infra/ should still plan cleanly against whatever image the last
      # apply used. -var falls back to state/tfvars when omitted only if the
      # var already has a value there; a first-ever plan with no image yet
      # published is expected to fail on the module's validation — that
      # failure is correct, not a bug in this workflow.
      - run: |
          terraform plan -input=false -lock=false \
            -var="subscription_id=614e6f86-e401-4bdf-8479-a59986e18815" \
            -var="sluice_api_key=${{ secrets.TF_VAR_SLUICE_API_KEY }}"

  # ── Apply on main ────────────────────────────────────────────────────────
  # Gated by the "production" GitHub Environment's required-reviewer
  # protection rule (configured in repo Settings, not in this file) — that
  # approval step is what makes this "human-gated apply" rather than
  # push-to-main-equals-live-infra.
  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-push-api]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/env/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 614e6f86-e401-4bdf-8479-a59986e18815 # celladore-sub — pinned, not inherited from CLI/runner context

      - run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=xtox-prod.tfstate"

      - run: |
          terraform apply -input=false -auto-approve \
            -var="subscription_id=614e6f86-e401-4bdf-8479-a59986e18815" \
            -var="container_image=${{ env.IMAGE_NAME }}@${{ needs.build-push-api.outputs.digest }}" \
            -var="sluice_api_key=${{ secrets.TF_VAR_SLUICE_API_KEY }}"

  # ── Frontend static assets ──────────────────────────────────────────────
  # Independent of the Terraform apply above: this pushes build output to an
  # SWA that must already exist (created by a prior terraform-apply run).
  # Requires secrets.AZURE_STATIC_WEB_APPS_API_TOKEN — see the setup note
  # at the top of this file for the chicken-and-egg on the very first apply.
  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm build
        working-directory: frontend

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: build
          skip_app_build: true
